<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Career-Ops</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<style>
  :root{--bg:#080810;--bg2:#0d0d1a;--card:#13131f;--border:#1e1e35;--purple:#8b5cf6;--cyan:#06b6d4;--green:#10b981;--yellow:#f59e0b;--red:#ef4444;--text:#e2e8f0;--dim:#94a3b8;--faint:#475569}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}

  /* NAV */
  nav{display:flex;align-items:center;justify-content:space-between;padding:14px 32px;background:rgba(8,8,16,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
  .logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;background:linear-gradient(135deg,var(--purple),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none}
  .nav-right{display:flex;align-items:center;gap:12px}
  .user-pill{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:6px 14px 6px 8px;font-size:13px;color:var(--dim)}
  .avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--cyan));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
  .btn{padding:8px 16px;border-radius:8px;font-weight:600;font-size:13px;border:none;cursor:pointer;text-decoration:none;font-family:'Inter',sans-serif;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
  .btn-primary{background:linear-gradient(135deg,var(--purple),var(--cyan));color:#fff}
  .btn-primary:hover{opacity:.9}
  .btn-ghost{background:transparent;color:var(--dim);border:1px solid var(--border)}
  .btn-ghost:hover{border-color:var(--purple);color:var(--text)}

  /* LAYOUT */
  .container{max-width:1100px;margin:0 auto;padding:32px 24px}

  /* GREETING */
  .greeting{margin-bottom:32px}
  .greeting h1{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;margin-bottom:4px}
  .greeting p{color:var(--dim);font-size:14px}

  /* STATS ROW */
  .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:32px}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px}
  .stat-label{font-size:12px;color:var(--faint);font-weight:500;margin-bottom:8px}
  .stat-num{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700}
  .stat-sub{font-size:12px;color:var(--dim);margin-top:4px}
  .num-green{color:var(--green)}
  .num-yellow{color:var(--yellow)}
  .num-purple{color:var(--purple)}
  .num-cyan{color:var(--cyan)}

  /* SECTION HEADER */
  .section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .section-title{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700}

  /* HISTORY TABLE */
  .history-table{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
  .table-head{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;padding:12px 20px;border-bottom:1px solid var(--border);font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
  .table-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;padding:14px 20px;border-bottom:1px solid var(--border);align-items:center;transition:background .15s;cursor:pointer}
  .table-row:last-child{border-bottom:none}
  .table-row:hover{background:rgba(139,92,246,.05)}
  .job-name{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .job-date{font-size:12px;color:var(--dim)}
  .grade-pill{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px}
  .ga{background:rgba(16,185,129,.15);color:var(--green)}
  .gb{background:rgba(6,182,212,.12);color:var(--cyan)}
  .gc{background:rgba(245,158,11,.12);color:var(--yellow)}
  .gd{background:rgba(239,68,68,.1);color:#f87171}
  .gf{background:rgba(239,68,68,.2);color:var(--red)}
  .rec-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
  .rec-apply{background:rgba(16,185,129,.12);color:#6ee7b7}
  .rec-consider{background:rgba(245,158,11,.12);color:#fcd34d}
  .rec-skip{background:rgba(239,68,68,.1);color:#fca5a5}

  /* EMPTY */
  .empty{text-align:center;padding:60px 24px;color:var(--dim)}
  .empty-icon{font-size:48px;margin-bottom:16px}
  .empty h3{font-size:16px;font-weight:600;margin-bottom:8px;color:var(--text)}
  .empty p{font-size:14px;max-width:320px;margin:0 auto 24px;line-height:1.6}

  /* SKELETON */
  .skeleton{background:linear-gradient(90deg,var(--card) 25%,var(--border) 50%,var(--card) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:6px;height:16px}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

  /* DETAIL DRAWER */
  .drawer-bg{position:fixed;inset:0;background:rgba(8,8,16,.75);backdrop-filter:blur(4px);z-index:100;display:none;align-items:flex-end;justify-content:center}
  .drawer-bg.open{display:flex}
  .drawer{background:var(--card);border:1px solid var(--border);border-radius:20px 20px 0 0;padding:32px;width:100%;max-width:600px;max-height:80vh;overflow-y:auto}
  .drawer-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
  .drawer-title{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700}
  .close-btn{background:none;border:none;color:var(--dim);cursor:pointer;font-size:20px;padding:4px}
  .score-bars{display:flex;flex-direction:column;gap:8px;margin:16px 0}
  .bar-row{display:flex;align-items:center;gap:10px}
  .bar-label{font-size:12px;color:var(--dim);width:120px;flex-shrink:0}
  .bar-track{flex:1;height:6px;background:var(--bg2);border-radius:3px;overflow:hidden}
  .bar-fill{height:100%;border-radius:3px}
  .bar-num{font-size:12px;font-weight:600;color:var(--dim);width:24px;text-align:right}
  .pitch-box{background:var(--bg2);border-radius:8px;padding:12px 14px;font-size:13px;font-style:italic;color:var(--dim);margin-top:12px;line-height:1.6}
  .rec-box{padding:10px 14px;border-radius:8px;font-size:13px;margin-top:10px;line-height:1.5}

  @media(max-width:640px){
    .table-head,.table-row{grid-template-columns:2fr 1fr 1fr}
    .col-comp,.col-date{display:none}
    nav{padding:14px 16px}
    .container{padding:24px 16px}
  }
</style>
</head>
<body>

<nav>
  <a class="logo" href="/">⚡ Career-Ops</a>
  <div class="nav-right">
    <div class="user-pill">
      <div class="avatar" id="avatarInitial">?</div>
      <span id="userEmail">Loading…</span>
    </div>
    <a class="btn btn-primary" href="/app.html">+ Evaluate Jobs</a>
    <button class="btn btn-ghost" onclick="handleSignOut()">Sign Out</button>
  </div>
</nav>

<div class="container">

  <!-- GREETING -->
  <div class="greeting">
    <h1 id="greetingText">Good morning 👋</h1>
    <p>Here's your job evaluation history</p>
  </div>

  <!-- STATS -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">Total Evaluated</div>
      <div class="stat-num num-purple" id="statTotal">—</div>
      <div class="stat-sub">all time</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Apply Recommended</div>
      <div class="stat-num num-green" id="statApply">—</div>
      <div class="stat-sub">strong matches</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Consider</div>
      <div class="stat-num num-yellow" id="statConsider">—</div>
      <div class="stat-sub">worth a look</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Avg Score</div>
      <div class="stat-num num-cyan" id="statAvg">—</div>
      <div class="stat-sub">out of 5.0</div>
    </div>
  </div>

  <!-- HISTORY -->
  <div class="section-hdr">
    <div class="section-title">Evaluation History</div>
    <button class="btn btn-ghost" onclick="loadHistory()">↻ Refresh</button>
  </div>

  <div class="history-table">
    <div class="table-head">
      <span>Job</span>
      <span>Grade</span>
      <span>Rec</span>
      <span class="col-comp">Avg Score</span>
      <span class="col-date">Date</span>
    </div>
    <div id="historyBody">
      <!-- rows injected by JS -->
      <div style="padding:20px">
        <div class="skeleton" style="width:60%;margin-bottom:12px"></div>
        <div class="skeleton" style="width:40%;margin-bottom:12px"></div>
        <div class="skeleton" style="width:50%"></div>
      </div>
    </div>
  </div>

</div>

<!-- DETAIL DRAWER -->
<div class="drawer-bg" id="drawerBg" onclick="closeDrawer(event)">
  <div class="drawer" id="drawer">
    <div class="drawer-header">
      <div class="drawer-title" id="drawerTitle">—</div>
      <button class="close-btn" onclick="closeDrawer()">×</button>
    </div>
    <div id="drawerBody"></div>
  </div>
</div>

<script>
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let evaluations = [];
let user = null;

// ── AUTH CHECK ──
async function init() {
  const { data } = await sb.auth.getSession();
  if (!data.session) { window.location.href = '/login.html'; return; }
  user = data.session.user;

  // Set greeting
  const hour = new Date().getHours();
  const greet = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
  document.getElementById('greetingText').textContent = greet + ' 👋';

  // Set user info
  const email = user.email || '';
  document.getElementById('userEmail').textContent = email.split('@')[0];
  document.getElementById('avatarInitial').textContent = email[0]?.toUpperCase() || '?';

  await loadHistory();
}

async function loadHistory() {
  document.getElementById('historyBody').innerHTML = `
    <div style="padding:20px">
      <div class="skeleton" style="width:70%;margin-bottom:12px"></div>
      <div class="skeleton" style="width:50%;margin-bottom:12px"></div>
      <div class="skeleton" style="width:60%"></div>
    </div>`;

  const { data, error } = await sb
    .from('evaluations')
    .select('*')
    .eq('user_id', user.id)
    .order('created_at', { ascending: false });

  if (error) {
    document.getElementById('historyBody').innerHTML =
      `<div class="empty"><div class="empty-icon">⚠️</div><h3>Could not load history</h3><p>${error.message}</p></div>`;
    return;
  }

  evaluations = data || [];
  renderStats();
  renderHistory();
}

function renderStats() {
  const total   = evaluations.length;
  const apply   = evaluations.filter(e => e.recommendation === 'APPLY').length;
  const consider= evaluations.filter(e => e.recommendation === 'CONSIDER').length;
  const avg     = total === 0 ? 0 :
    evaluations.reduce((s, e) => s + ((e.cv_match + e.alignment + e.comp + e.culture + e.red_flags) / 5), 0) / total;

  document.getElementById('statTotal').textContent   = total;
  document.getElementById('statApply').textContent   = apply;
  document.getElementById('statConsider').textContent= consider;
  document.getElementById('statAvg').textContent     = total === 0 ? '—' : avg.toFixed(1);
}

function renderHistory() {
  const body = document.getElementById('historyBody');
  if (evaluations.length === 0) {
    body.innerHTML = `
      <div class="empty">
        <div class="empty-icon">📋</div>
        <h3>No evaluations yet</h3>
        <p>Head to the app, paste a job description, and evaluate your first role.</p>
        <a class="btn btn-primary" href="/app.html">+ Evaluate a Job</a>
      </div>`;
    return;
  }

  body.innerHTML = evaluations.map(e => {
    const avg = ((e.cv_match + e.alignment + e.comp + e.culture + e.red_flags) / 5).toFixed(1);
    const date = new Date(e.created_at).toLocaleDateString('en-US', { month:'short', day:'numeric' });
    const gc = {A:'ga',B:'gb',C:'gc',D:'gd',F:'gf'}[e.grade] || 'gc';
    const rc = {APPLY:'rec-apply',CONSIDER:'rec-consider',SKIP:'rec-skip'}[e.recommendation] || '';
    return `
      <div class="table-row" onclick="openDrawer('${e.id}')">
        <div>
          <div class="job-name">${esc(e.job_title)}</div>
          <div class="job-date">${esc(e.summary || '')}</div>
        </div>
        <div><span class="grade-pill ${gc}">${e.grade}</span></div>
        <div><span class="rec-badge ${rc}">${e.recommendation}</span></div>
        <div class="col-comp" style="font-weight:600;color:var(--cyan)">${avg}</div>
        <div class="col-date" style="color:var(--faint);font-size:12px">${date}</div>
      </div>`;
  }).join('');
}

function openDrawer(id) {
  const e = evaluations.find(x => x.id === id);
  if (!e) return;
  document.getElementById('drawerTitle').textContent = e.job_title;
  const avg = ((e.cv_match + e.alignment + e.comp + e.culture + e.red_flags) / 5).toFixed(1);
  const gc = {A:'ga',B:'gb',C:'gc',D:'gd',F:'gf'}[e.grade] || 'gc';
  const rc = {APPLY:'rec-apply',CONSIDER:'rec-consider',SKIP:'rec-skip'}[e.recommendation] || '';
  const recLabel = {APPLY:'✅ Apply','CONSIDER':'🤔 Consider',SKIP:'⛔ Skip'}[e.recommendation] || e.recommendation;

  const dims = [
    { label:'CV Match', val:e.cv_match },
    { label:'Role Alignment', val:e.alignment },
    { label:'Compensation', val:e.comp },
    { label:'Culture Signals', val:e.culture },
    { label:'Red Flags', val:e.red_flags },
  ];

  document.getElementById('drawerBody').innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
      <span class="grade-pill ${gc}" style="width:44px;height:44px;font-size:20px">${e.grade}</span>
      <div>
        <div style="font-size:13px;color:var(--dim)">${esc(e.summary)}</div>
        <div style="font-size:12px;color:var(--faint);margin-top:2px">${new Date(e.created_at).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}</div>
      </div>
    </div>
    <div class="score-bars">
      ${dims.map(d=>`
        <div class="bar-row">
          <span class="bar-label">${d.label}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${d.val*20}%;background:${barColor(d.val)}"></div></div>
          <span class="bar-num">${d.val}/5</span>
        </div>`).join('')}
    </div>
    <div class="rec-box ${rc}"><strong>${recLabel}:</strong> ${esc(e.rec_reason)}</div>
    ${e.pitch ? `<div class="pitch-box">"${esc(e.pitch)}"</div>` : ''}
    <div style="margin-top:20px;display:flex;gap:8px">
      <button class="btn btn-ghost" onclick="copyReport('${e.id}')">Copy Report</button>
    </div>
  `;
  document.getElementById('drawerBg').classList.add('open');
}

function closeDrawer(e) {
  if (!e || e.target === document.getElementById('drawerBg')) {
    document.getElementById('drawerBg').classList.remove('open');
  }
}

function copyReport(id) {
  const e = evaluations.find(x => x.id === id);
  if (!e) return;
  const md = `# ${e.job_title}\n**Grade:** ${e.grade} · **Rec:** ${e.recommendation}\n\n${e.summary}\n\n## Scores\n| Dim | Score |\n|---|---|\n| CV Match | ${e.cv_match}/5 |\n| Alignment | ${e.alignment}/5 |\n| Comp | ${e.comp}/5 |\n| Culture | ${e.culture}/5 |\n| Red Flags | ${e.red_flags}/5 |\n\n${e.rec_reason}\n${e.pitch ? `\n> "${e.pitch}"` : ''}`;
  navigator.clipboard.writeText(md).then(() => alert('Report copied!'));
}

function barColor(v) {
  if (v >= 4) return 'linear-gradient(90deg,#10b981,#34d399)';
  if (v >= 3) return 'linear-gradient(90deg,#06b6d4,#38bdf8)';
  if (v >= 2) return 'linear-gradient(90deg,#f59e0b,#fbbf24)';
  return 'linear-gradient(90deg,#ef4444,#f87171)';
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function handleSignOut() {
  await sb.auth.signOut();
  window.location.href = '/login.html';
}

init();
</script>
</body>
</html>
