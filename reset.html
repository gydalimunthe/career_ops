<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Career-Ops</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:#080810;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
  .logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;background:linear-gradient(135deg,#8b5cf6,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none;margin-bottom:40px;display:block;text-align:center}
  .card{background:#13131f;border:1px solid #1e1e35;border-radius:20px;padding:40px;width:100%;max-width:420px}
  .card-icon{font-size:32px;margin-bottom:20px}
  h1{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;margin-bottom:6px}
  .subtitle{font-size:14px;color:#94a3b8;margin-bottom:28px}
  .form-group{margin-bottom:16px}
  label{display:block;font-size:12px;font-weight:600;color:#94a3b8;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
  input{width:100%;background:#0d0d1a;border:1px solid #1e1e35;border-radius:8px;padding:11px 14px;color:#e2e8f0;font-family:'Inter',sans-serif;font-size:14px;outline:none;transition:border-color .2s}
  input:focus{border-color:#8b5cf6}
  .btn{width:100%;padding:12px;border-radius:8px;font-weight:600;font-size:15px;border:none;cursor:pointer;font-family:'Inter',sans-serif;background:linear-gradient(135deg,#8b5cf6,#06b6d4);color:#fff;margin-top:4px;transition:opacity .2s}
  .btn:hover{opacity:.9}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .error-msg{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);border-radius:8px;padding:10px 14px;font-size:13px;color:#fca5a5;margin-bottom:14px;display:none}
  .success-msg{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.25);border-radius:8px;padding:10px 14px;font-size:13px;color:#6ee7b7;margin-bottom:14px;display:none}
  .strength{height:4px;border-radius:2px;margin-top:6px;transition:all .3s}
  .strength-weak{background:#ef4444;width:33%}
  .strength-medium{background:#f59e0b;width:66%}
  .strength-strong{background:#10b981;width:100%}
</style>
</head>
<body>
  <a class="logo" href="/">⚡ Career-Ops</a>
  <div class="card">
    <div class="card-icon">🔐</div>
    <h1>Set new password</h1>
    <div class="subtitle">Choose a strong password for your account</div>
    <div class="error-msg" id="error-msg"></div>
    <div class="success-msg" id="success-msg"></div>
    <div class="form-group">
      <label>New Password</label>
      <input type="password" id="new-password" placeholder="Min. 8 characters" oninput="checkStrength(this.value)">
      <div class="strength" id="strength-bar"></div>
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="confirm-password" placeholder="••••••••">
    </div>
    <button class="btn" id="reset-btn" onclick="handleReset()">Update Password</button>
  </div>

<script>
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function checkStrength(val) {
  const bar = document.getElementById('strength-bar');
  if (val.length === 0) { bar.className = 'strength'; return; }
  if (val.length < 8) { bar.className = 'strength strength-weak'; return; }
  const strong = /[A-Z]/.test(val) && /[0-9]/.test(val) && /[^a-zA-Z0-9]/.test(val);
  bar.className = 'strength ' + (strong ? 'strength-strong' : 'strength-medium');
}

async function handleReset() {
  const pw  = document.getElementById('new-password').value;
  const cpw = document.getElementById('confirm-password').value;
  const err = document.getElementById('error-msg');
  const suc = document.getElementById('success-msg');

  err.style.display = 'none'; suc.style.display = 'none';
  if (pw.length < 8) { err.textContent = 'Password must be at least 8 characters'; err.style.display = 'block'; return; }
  if (pw !== cpw) { err.textContent = 'Passwords do not match'; err.style.display = 'block'; return; }

  const btn = document.getElementById('reset-btn');
  btn.disabled = true; btn.textContent = 'Updating…';

  const { error } = await supabase.auth.updateUser({ password: pw });
  btn.disabled = false; btn.textContent = 'Update Password';

  if (error) { err.textContent = error.message; err.style.display = 'block'; return; }
  suc.textContent = '✓ Password updated! Redirecting to dashboard…';
  suc.style.display = 'block';
  setTimeout(() => window.location.href = '/dashboard.html', 2000);
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') handleReset(); });
</script>
</body>
</html>
