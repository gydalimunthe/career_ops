<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Email — Career-Ops</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/config.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:#080810;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
  .logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;background:linear-gradient(135deg,#8b5cf6,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none;margin-bottom:48px;display:block}
  .icon{font-size:56px;margin-bottom:20px}
  h1{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;margin-bottom:10px}
  p{color:#94a3b8;font-size:15px;max-width:380px;line-height:1.7;margin-bottom:32px}
  .btn{padding:12px 28px;border-radius:8px;font-weight:600;font-size:15px;text-decoration:none;background:linear-gradient(135deg,#8b5cf6,#06b6d4);color:#fff;border:none;cursor:pointer;display:inline-block;transition:opacity .2s}
  .btn:hover{opacity:.9}
  .spinner{width:40px;height:40px;border:3px solid #1e1e35;border-top-color:#8b5cf6;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 24px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <a class="logo" href="./index.html">⚡ Career-Ops</a>
  <div id="state-loading">
    <div class="spinner"></div>
    <h1>Verifying your email…</h1>
    <p>Just a moment.</p>
  </div>
  <div id="state-success" style="display:none">
    <div class="icon">✅</div>
    <h1>Email verified!</h1>
    <p>Your account is ready. Let's start evaluating jobs.</p>
    <a class="btn" href="./dashboard.html">Go to Dashboard →</a>
  </div>
  <div id="state-error" style="display:none">
    <div class="icon">❌</div>
    <h1>Verification failed</h1>
    <p id="error-detail">The link may have expired. Request a new one from the login page.</p>
    <a class="btn" href="./login.html">Back to Sign In</a>
  </div>

<script>
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

supabase.auth.onAuthStateChange((event, session) => {
  document.getElementById('state-loading').style.display = 'none';
  if (event === 'SIGNED_IN' && session) {
    document.getElementById('state-success').style.display = 'block';
  } else if (event === 'PASSWORD_RECOVERY') {
    window.location.href = BASE_URL + '/reset.html';
  } else {
    document.getElementById('state-error').style.display = 'block';
  }
});

// Fallback if no event fires
setTimeout(() => {
  if (document.getElementById('state-loading').style.display !== 'none') {
    document.getElementById('state-loading').style.display = 'none';
    document.getElementById('state-error').style.display = 'block';
    document.getElementById('error-detail').textContent = 'Link expired or already used. Try signing in directly.';
  }
}, 5000);
</script>
</body>
</html>
