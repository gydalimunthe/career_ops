<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found | Career-Ops</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:#080810;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  .code{font-family:'Space Grotesk',sans-serif;font-size:120px;font-weight:700;line-height:1;background:linear-gradient(135deg,#8b5cf6,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:16px}
  h1{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:600;margin-bottom:12px}
  p{color:#94a3b8;font-size:15px;margin-bottom:36px;max-width:380px;line-height:1.7}
  .links{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .btn{padding:10px 22px;border-radius:8px;font-weight:600;font-size:14px;text-decoration:none;transition:all .2s}
  .btn-primary{background:linear-gradient(135deg,#8b5cf6,#06b6d4);color:#fff}
  .btn-primary:hover{opacity:.9}
  .btn-ghost{border:1px solid #1e1e35;color:#94a3b8}
  .btn-ghost:hover{border-color:#8b5cf6;color:#e2e8f0}
</style>
</head>
<body>
  <div class="code">404</div>
  <h1>Page not found</h1>
  <p>The page you're looking for doesn't exist or was moved. Let's get you back on track.</p>
  <div class="links">
    <a class="btn btn-primary" href="/">Go Home</a>
    <a class="btn btn-ghost" href="/app.html">Launch App</a>
  </div>
</body>
</html>
